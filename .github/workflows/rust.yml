name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Stop spending runner time on superseded PR commits, but let main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Fresh runners cannot use workspace incremental builds. Debug symbols also
  # inflate dependency caches and link times without helping these checks.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust

      - name: Formatting check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --no-deps --all-targets --all-features

      - name: Documentation
        run: cargo doc --locked --no-deps --all-features

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Test
        run: cargo nextest run --locked

      - name: Documentation tests
        run: cargo test --locked --doc

  loom:
    name: Loom checks
    runs-on: ubuntu-latest
    # Keep the alternate configuration in its own job/cache rather than
    # rebuilding dependencies with different RUSTFLAGS in the normal jobs.
    env:
      RUSTFLAGS: --cfg loom

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust

      - name: Clippy (Loom configuration)
        run: cargo clippy --locked --no-deps --lib --tests

      - name: Loom tests
        run: cargo test --locked --lib loom_tests -- --test-threads=1
