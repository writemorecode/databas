[package]
name = "databas"
version = '0.1.0'
authors = ['writemorecode']
edition = '2024'
repository = 'https://github.com/writemorecode/databas'

[dependencies]
crc = "3.4.0"
rustyline = { version = "15.0.0", default-features = false, features = ["with-file-history"] }
thiserror = "2.0.18"

[dev-dependencies]
fastrand = "2.3.0"
loom = "0.7.2"
proptest = "1.9.0"
tempfile = "3.25.0"

[profile.release]
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[lints.clippy]
# Don't panic
expect_used = "deny"
get_unwrap = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"

cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"

map_err_ignore = "deny"

# Enable these incrementally while the existing codebase is brought into compliance.
needless_pass_by_ref_mut = "deny"
needless_pass_by_value = "allow"
redundant_closure_for_method_calls = "deny"
equatable_if_let = "deny"
unnecessary_wraps = "allow"

redundant_pub_crate = "allow"
wildcard_imports = "allow"

significant_drop_tightening = "allow"

elidable_lifetime_names = "deny"
