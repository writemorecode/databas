[workspace]
members = ["crates/sql-parser", "crates/storage", "crates/relational", "crates/query"]
default-members = [".", "crates/sql-parser", "crates/storage", "crates/relational", "crates/query"]
resolver = "3"

[package]
name = "databas"
version = '0.1.0'
authors = ['writemorecode']
edition = '2024'
repository = 'https://github.com/writemorecode/databas'

[dependencies]
databas-relational = { path = "crates/relational" }
databas-query = { path = "crates/query" }
databas-sql-parser = { path = "crates/sql-parser" }
databas-storage = { path = "crates/storage" }
rustyline = { version = "15.0.0", default-features = false, features = ["with-file-history"] }
thiserror = "2.0.18"

[dev-dependencies]
databas-relational = { path = "crates/relational", features = ["test-support"] }
tempfile = "3.25.0"

[profile.release]
panic = "abort"

[lints]
workspace = true

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
# Don't panic
expect_used = "deny"
get_unwrap = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"

cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"

map_err_ignore = "deny"

# Enable these incrementally while the existing codebase is brought into compliance.
needless_pass_by_ref_mut = "deny"
needless_pass_by_value = "deny"
redundant_closure_for_method_calls = "deny"
equatable_if_let = "deny"
unnecessary_wraps = "deny"

redundant_pub_crate = "deny"
wildcard_imports = "deny"

significant_drop_tightening = "allow"

elidable_lifetime_names = "deny"
